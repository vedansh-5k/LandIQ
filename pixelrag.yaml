# pixelrag.yaml — LandIQ visual RAG config
#
# Points PixelRAG at the SAME clean real-estate PDF folder the text RAG uses
# (src/rag/loader.py -> data/land_reports/) - 11 verified real-estate market
# reports, not the old mixed data/sample_reports/ folder (which had ~105
# unrelated personal/academic PDFs diluting retrieval). Same knowledge base
# as text RAG, now also indexed as screenshots so tables/maps/layout survive
# retrieval.
#
# Nothing here is a Python literal — every value is editable in this file,
# not hardcoded in code. Change `embed.device` to `cuda` if you later run
# this on a machine with more VRAM than the 4GB RTX 2050 this was built on.

source:
  type: local
  path: ./data/land_reports

embed:
  model: Qwen/Qwen3-VL-Embedding-2B
  device: cpu

output: ./pixelrag_index
